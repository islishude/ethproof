name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: make fmt-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: make lint

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: make build
      - run: make unit-test

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: make bindings
      - run: git diff --exit-code
      - run: make e2e-test

  pos-e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make pos-e2e-test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: pos-e2e-logs
          path: bin/pos-testnet/compose.log
